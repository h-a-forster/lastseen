[project]
name = "hackathon-starter"
version = "0.1.0"
description = "Hackathon starter: FastAPI + LiteLLM (any model provider) + static frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28",
    "litellm>=1.104.2",
    "numpy>=2.3",
    "pillow==12.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
